<style>
  :root{

  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px;}
  .brand{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
  .brand .jp{color:var(--accent);font-weight:800}
  .brand small{color:var(--sub);font-weight:600;font-size:11px;margin-left:auto}
  .search{display:flex;gap:8px}
  .search input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
    font-size:16px;background:#fff;outline:none}
  .search input:focus{border-color:var(--accent2)}
  .toolbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:8px;
    font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .romaji-toggle{margin-left:auto;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
  .cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:8px 16px 80px;max-width:720px;margin:0 auto}
  .count{color:var(--sub);font-size:12px;margin:8px 2px 12px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;
    transition:transform .05s ease, box-shadow .15s ease}
  .card:active{transform:scale(.995)}
  .card .body{flex:1;min-width:0}
  .card .en{font-size:16px;font-weight:700;line-height:1.35}
  .card .ja{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:.3px}
  .card .ro{font-size:13px;color:var(--sub);margin-top:3px;font-style:italic}
  .card .tag{display:inline-block;font-size:10px;font-weight:800;color:#fff;
    background:var(--accent2);border-radius:6px;padding:2px 7px;margin-top:8px;letter-spacing:.5px}
  .card .tag.w{background:#0a9d63}
  .speak{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .speak:active{background:var(--chip)}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);
    border-top:1px solid var(--line);padding:8px 16px;text-align:center;font-size:11px;color:var(--sub)}
  footer a{color:var(--accent2);text-decoration:none;font-weight:700}
  .warn{display:none;background:#fff5f5;border:1px solid #ffd0cf;color:#a33;border-radius:10px;
    padding:8px 12px;font-size:12px;margin:8px 16px 0}
  .warn.show{display:block}
  .hide-ro .ro{display:none}
</style>
</head>

  {c:"Useful Words",t:"w",en:"convenience",ja:"便利（べんり）",ro:"benri"},
  {c:"Useful Words",t:"w",en:"tired",ja:"疲れた（つかれた）",ro:"tsukareta"},
  {c:"Useful Words",t:"w",en:"hungry",ja:"お腹がすいた（おなかがすいた）",ro:"onaka ga suita"},
  {c:"Useful Words",t:"w",en:"cute",ja:"かわいい",ro:"kawaii"},
  {c:"Useful Words",t:"w",en:"amazing",ja:"すごい",ro:"sugoi"},
];

/* ---- State ---- */
let curCat = "All";
let curType = "all";
let query = "";
let showRo = true;

/* ---- TTS ---- */
let jaVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  jaVoice = voices.find(v=>v.lang==="ja-JP") || voices.find(v=>v.lang && v.lang.startsWith("ja")) || null;
  const hasSpeech = "speechSynthesis" in window;
  document.getElementById("warn").classList.toggle("show", hasSpeech && voices.length>0 && !jaVoice);
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if(jaVoice) u.voice = jaVoice;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
// strip furigana in ( ) for cleaner speech, keep kanji
function speakText(ja){
  return ja.replace(/（[^）]*）/g,"").replace(/___/g,"");
}

/* ---- Render ---- */
const catsEl = document.getElementById("cats");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");

function buildCats(){
  const all = ["All", ...CATS];
  catsEl.innerHTML = "";
  all.forEach(c=>{
    const b = document.createElement("button");
    b.textContent = c;
    if(c===curCat) b.classList.add("on");
    b.onclick = ()=>{ curCat=c; render(); [...catsEl.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); };
    catsEl.appendChild(b);
  });
}

function match(item){
  if(curType!=="all" && item.t!==curType) return false;
  if(curCat!=="All" && item.c!==curCat) return false;
  if(query){
    const q = query.toLowerCase();
    if(!(item.en.toLowerCase().includes(q) || item.ja.includes(query) || item.ro.toLowerCase().includes(q))) return false;
  }
  return true;
}

function render(){
  const items = DATA.filter(match);
  countEl.textContent = `${items.length} ${items.length===1?"entry":"entries"}`;
  listEl.className = showRo ? "" : "hide-ro";
  if(items.length===0){
    listEl.innerHTML = `<div class="empty">No results. Try another word.</div>`;
    return;
  }
  listEl.innerHTML = "";
  items.forEach(it=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="body">
        <div class="en">${escapeHtml(it.en)}</div>
        <div class="ja">${escapeHtml(it.ja)}</div>
        <div class="ro">${escapeHtml(it.ro)}</div>
        <span class="tag ${it.t==='w'?'w':''}">${it.t==='w'?'WORD':'PHRASE'}</span>
      </div>
      <button class="speak" aria-label="Play pronunciation">🔊</button>`;
    const doSpeak = (e)=>{ e && e.stopPropagation(); speak(speakText(it.ja)); };
    card.querySelector(".speak").onclick = doSpeak;
    card.onclick = ()=>speak(speakText(it.ja));
    listEl.appendChild(card);
  });
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---- Events ---- */
document.getElementById("q").addEventListener("input", e=>{ query=e.target.value.trim(); render(); });
document.getElementById("typeSeg").addEventListener("click", e=>{
  if(e.target.tagName!=="BUTTON") return;
  curType = e.target.dataset.t;
  [...e.currentTarget.children].forEach(b=>b.classList.remove("on"));
  e.target.classList.add("on");
  render();
});
document.getElementById("roToggle").addEventListener("change", e=>{ showRo=e.target.checked; render(); });

buildCats();
render();
</script>
</body>
</html>
