<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>テトリス ｜ NyanChu</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --grid: #21262d;
    --text: #e6edf3;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 12px; gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: 4px; color: var(--accent); }
  .game {
    display: flex; gap: 16px; align-items: flex-start;
  }
  canvas {
    background: var(--panel);
    border: 2px solid var(--grid);
    border-radius: 8px;
    touch-action: none;
  }
  .side {
    display: flex; flex-direction: column; gap: 14px;
    min-width: 110px;
  }
  .box {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .box .label { font-size: 11px; opacity: .6; text-transform: uppercase; letter-spacing: 1px; }
  .box .value { font-size: 22px; font-weight: bold; }
  #nextCanvas { display: block; }
  .controls { font-size: 12px; line-height: 1.8; opacity: .8; }
  .controls b { color: var(--accent); }
  .touch {
    display: none;
    gap: 10px; margin-top: 4px;
  }
  .touch button {
    flex: 1; padding: 16px 0;
    font-size: 20px; border: none; border-radius: 10px;
    background: var(--grid); color: var(--text);
    active: none;
  }
  .touch button:active { background: var(--accent); color: #000; }
  .overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: rgba(0,0,0,.75); backdrop-filter: blur(4px);
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 32px; margin: 0; }
  .overlay button {
    padding: 14px 32px; font-size: 18px; border: none;
    border-radius: 10px; background: var(--accent); color: #000;
    font-weight: bold; cursor: pointer;
  }
  @media (max-width: 560px) {
    .controls { display: none; }
    .touch { display: flex; }
  }
</style>
</head>
<body>
  <h1>T E T R I S</h1>
  <div class="game">
    <canvas id="board" width="240" height="480"></canvas>
    <div class="side">
      <div class="box">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="box">
        <div class="label">Lines</div>
        <div class="value" id="lines">0</div>
      </div>
      <div class="box">
        <div class="label">Level</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="box">
        <div class="label">Next</div>
        <canvas id="nextCanvas" width="80" height="80"></canvas>
      </div>
      <div class="controls">
        <div><b>← →</b> 移動</div>
        <div><b>↑</b> 回転</div>
        <div><b>↓</b> ソフト</div>
        <div><b>Space</b> ハード</div>
        <div><b>P</b> ポーズ</div>
      </div>
    </div>
  </div>

  <div class="touch">
    <button id="btnLeft">◀</button>
    <button id="btnRotate">⟳</button>
    <button id="btnRight">▶</button>
    <button id="btnDown">▼</button>
    <button id="btnDrop">⤓</button>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlayText">GAME OVER</h2>
    <button id="restartBtn">もう一度</button>
  </div>

<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nctx = nextCanvas.getContext('2d');

  const COLORS = {
    I: '#2dd4ee', O: '#f7d038', T: '#c264ff',
    S: '#3ddc84', Z: '#ff5a5a', J: '#4a90ff', L: '#ff9f43',
  };
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
  };
  const KINDS = Object.keys(SHAPES);

  let board, cur, nextKind, bag, score, lines, level, fallDelay, lastFall, over, paused, raf;

  function newBag() { bag = KINDS.slice().sort(() => Math.random() - 0.5); }
  function popKind() { if (!bag || !bag.length) newBag(); return bag.pop(); }

  function spawn(kind) {
    return { kind, cells: SHAPES[kind].map(c => c.slice()), x: 3, y: 0 };
  }

  function blocks(p, dx=0, dy=0, cells=null) {
    return (cells||p.cells).map(([cx,cy]) => [p.x+cx+dx, p.y+cy+dy]);
  }

  function rotatedCells(p) {
    if (p.kind === 'O') return p.cells.map(c => c.slice());
    const size = p.kind === 'I' ? 4 : 3;
    return p.cells.map(([cx,cy]) => [size-1-cy, cx]);
  }

  function valid(bs) {
    return bs.every(([x,y]) =>
      x>=0 && x<COLS && y<ROWS && (y<0 || !board[y][x]));
  }

  function reset() {
    board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
    bag = null;
    cur = spawn(popKind());
    nextKind = popKind();
    score = 0; lines = 0; level = 1;
    fallDelay = 500; lastFall = performance.now();
    over = false; paused = false;
    document.getElementById('overlay').classList.remove('show');
    updateHud();
  }

  function move(dx, dy) {
    if (valid(blocks(cur, dx, dy))) { cur.x+=dx; cur.y+=dy; return true; }
    return false;
  }

  function rotate() {
    const nc = rotatedCells(cur);
    for (const k of [0,-1,1,-2,2]) {
      if (valid(blocks(cur, k, 0, nc))) { cur.cells = nc; cur.x += k; return; }
    }
  }

  function hardDrop() {
    while (move(0,1)) score += 2;
    lock();
  }

  function softDrop() {
    if (move(0,1)) score += 1; else lock();
    lastFall = performance.now();
  }

  function lock() {
    for (const [x,y] of blocks(cur)) {
      if (y < 0) { gameOver(); return; }
      board[y][x] = COLORS[cur.kind];
    }
    clearLines();
    cur = spawn(nextKind);
    nextKind = popKind();
    if (!valid(blocks(cur))) gameOver();
    updateHud();
  }

  function clearLines() {
    let kept = board.filter(r => !r.every(c => c));
    const cleared = ROWS - kept.length;
    if (cleared) {
      while (kept.length < ROWS) kept.unshift(Array(COLS).fill(null));
      board = kept;
      lines += cleared;
      score += [0,100,300,500,800][cleared] * level;
      level = 1 + Math.floor(lines/10);
      fallDelay = Math.max(80, 500 - (level-1)*40);
    }
  }

  function ghostOffset() {
    let dy = 0;
    while (valid(blocks(cur, 0, dy+1))) dy++;
    return dy;
  }

  function gameOver() {
    over = true;
    document.getElementById('overlayText').textContent = 'GAME OVER';
    document.getElementById('overlay').classList.add('show');
  }

  function updateHud() {
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }

  function drawCell(c, x, y, color, ghost=false) {
    if (ghost) {
      c.strokeStyle = color; c.globalAlpha = 0.35;
      c.strokeRect(x*CELL+1.5, y*CELL+1.5, CELL-3, CELL-3);
      c.globalAlpha = 1;
    } else {
      c.fillStyle = color;
      c.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
      c.fillStyle = 'rgba(255,255,255,.18)';
      c.fillRect(x*CELL+1, y*CELL+1, CELL-2, 4);
    }
  }

  function draw() {
    ctx.fillStyle = '#161b22';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // grid
    ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
    for (let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,ROWS*CELL);ctx.stroke();}
    for (let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(COLS*CELL,y*CELL);ctx.stroke();}
    // settled
    for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++)
      if (board[y][x]) drawCell(ctx, x, y, board[y][x]);
    // ghost
    const g = ghostOffset();
    for (const [x,y] of blocks(cur, 0, g)) if (y>=0) drawCell(ctx, x, y, COLORS[cur.kind], true);
    // current
    for (const [x,y] of blocks(cur)) if (y>=0) drawCell(ctx, x, y, COLORS[cur.kind]);

    // next
    nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
    const ncell = 16;
    for (const [cx,cy] of SHAPES[nextKind]) {
      nctx.fillStyle = COLORS[nextKind];
      nctx.fillRect(cx*ncell+8, cy*ncell+16, ncell-2, ncell-2);
    }
  }

  function loop(t) {
    if (!over && !paused) {
      if (t - lastFall >= fallDelay) {
        if (!move(0,1)) lock();
        lastFall = t;
      }
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  // ---- 入力 ----
  document.addEventListener('keydown', (e) => {
    if (over) return;
    switch (e.key) {
      case 'ArrowLeft': case 'a': move(-1,0); break;
      case 'ArrowRight': case 'd': move(1,0); break;
      case 'ArrowDown': case 's': softDrop(); break;
      case 'ArrowUp': case 'w': rotate(); break;
      case ' ': e.preventDefault(); hardDrop(); break;
      case 'p': case 'P': paused = !paused; break;
      default: return;
    }
    if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
  });

  // タッチ操作
  const bind = (id, fn) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e)=>{e.preventDefault(); if(!over) fn();}, {passive:false});
    el.addEventListener('click', ()=>{ if(!over) fn(); });
  };
  bind('btnLeft', ()=>move(-1,0));
  bind('btnRight', ()=>move(1,0));
  bind('btnRotate', rotate);
  bind('btnDown', softDrop);
  bind('btnDrop', hardDrop);

  // スワイプ操作
  let tsx=0, tsy=0;
  canvas.addEventListener('touchstart', e=>{const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY;}, {passive:true});
  canvas.addEventListener('touchend', e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx)<10 && Math.abs(dy)<10) { rotate(); return; }
    if (Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1,0);
    else if (dy>0) { if (dy>60) hardDrop(); else softDrop(); }
  }, {passive:true});

  document.getElementById('restartBtn').addEventListener('click', reset);

  reset();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
