name: github-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_SITE_URL: https://ghantarou-gif.github.io/kasawa-news
          NEXT_PUBLIC_MEMBER_CODE_SHA256: "d8c46bb06452abf9e893afda1ea5291823029b9612c13f264afa2932e1f5f70c"
          NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-9222859203841922
      - run: touch out/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
